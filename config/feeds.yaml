# Your sources — what goes into your paper. Make this list yours.
#
# Three ways to list a source:
#
#   1. A catalogue id, as-is. config/catalogue.yaml holds the definitions
#      (feed URL, extraction route, licence, quirks) for sources that are
#      known to read well:
#
#        - bbc-world
#
#   2. A catalogue id with overrides — anything you set replaces the
#      catalogue's value for that field:
#
#        - id: bbc-world
#          section: news
#          max_items: 6
#
#   3. A source of your own, defined in full (an id not in the catalogue):
#
#        - id: my-local-paper
#          name: "The Local Paper"
#          section: local
#          kind: rss
#          url: "https://example.com/feed/"
#          max_items: 8
#          extract: trafilatura
#
#      Field reference is at the top of config/catalogue.yaml.
#
# `section` is a free label the editor sees — use whatever words suit your
# paper, except `radar` and `reddit`, which are reserved.
#
# Order matters only for the automatic (fallback) edition, which lists
# sources top to bottom.
#
# VERIFY AFTER ANY CHANGE:  python scripts/check_feeds.py

sources:
  - abc-au
  - guardian-au           # needs GUARDIAN_API_KEY
  - pulse-tas
  - bbc-world
  - aljazeera
  - npr
  - dw
  - theverge
  - daringfireball
  - conversation-au

# "The Chatter" page. Leave `subs` empty for no Reddit at all.
reddit:
  # Measured 2026-09-28: unauthenticated reddit .rss responses carry
  # x-ratelimit-used: 1, x-ratelimit-remaining: 0.0, x-ratelimit-reset: <=60 —
  # i.e. the budget is ~1 request per 60s per client (IP/UA), not per feed.
  # Irrelevant for a once-daily build: fetch sequentially with a pause.
  delay_sec: 65
  subs:
    # sort: top | hot | new. t: hour | day | week. keep: how many reach the paper.
    - {sub: "australia",   sort: top, t: day, limit: 40, keep: 4}
    - {sub: "AusFinance",  sort: top, t: day, limit: 40, keep: 3}
    - {sub: "energy",      sort: top, t: day, limit: 40, keep: 3}
    - {sub: "singularity", sort: top, t: day, limit: 40, keep: 3}

# Optional. Omit to use the built-ins in src/sources.py.
# defaults:
#   user_agent: "scribe-daily/1.0 (personal e-reader digest)"
#   per_domain_delay_sec: 1.0
#   request_timeout_sec: 20
